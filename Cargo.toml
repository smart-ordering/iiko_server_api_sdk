[package]
name = "iiko-server-api-sdk"
version = "0.2.0"
edition = "2024"
authors = ["Tigran Zhampeissov <zhampeisov_tigran@mail.ru>"]
description = "Simple Rust SDK for iiko server API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smart-ordering/iiko_server_api_sdk"

[dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn", "json", "query", "form", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
chrono = "0.4.45"

[dev-dependencies]
sha1 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
dotenvy = "0.15.7"
